function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
async function open_(){
  var pw=document.getElementById("pw").value.trim();
  try{
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(SALT),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},key,b(CT));
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){document.getElementById("err").style.display="block"}
}
document.getElementById("go").addEventListener("click",open_);
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")open_()});
